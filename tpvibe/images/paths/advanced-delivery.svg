<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">进阶篇交付路径</title>
  <desc id="desc">从需求和架构开始，经过实现、测试、部署和反馈，形成可回退、可观测、可迭代的产品交付过程。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#23352b" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l9 5-9 5" fill="none" stroke="#3f5b48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="#f7f2e8"/>
  <text x="72" y="72" fill="#26332b" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700">进阶篇：把作品推进成产品</text>
  <text x="72" y="106" fill="#69746c" font-family="system-ui,-apple-system,sans-serif" font-size="17">工程判断力来自一条可验证、可回退的交付链</text>
  <path d="M120 278H1080" fill="none" stroke="#b4aa76" stroke-width="16" stroke-linecap="round" opacity=".35"/>
  <path d="M120 278H1080" fill="none" stroke="#3f5b48" stroke-width="3" stroke-dasharray="7 11" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <circle cx="130" cy="278" r="54" fill="#e57c6e" stroke="#fffdf8" stroke-width="8"/>
    <path d="M111 278h38M130 259v38" stroke="#26332b" stroke-width="4" stroke-linecap="round"/>
    <text x="94" y="385" fill="#26332b" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700">需求</text>
    <text x="80" y="416" fill="#69746c" font-family="system-ui,-apple-system,sans-serif" font-size="15">说清问题</text>
  </g>
  <path d="M192 278h120" fill="none" stroke="#3f5b48" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <circle cx="350" cy="278" r="54" fill="#b4aa76" stroke="#fffdf8" stroke-width="8"/>
    <path d="M329 294l21-31 21 31-21-10z" fill="none" stroke="#26332b" stroke-width="4" stroke-linejoin="round"/>
    <text x="314" y="385" fill="#26332b" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700">架构</text>
    <text x="299" y="416" fill="#69746c" font-family="system-ui,-apple-system,sans-serif" font-size="15">拆解边界</text>
  </g>
  <path d="M412 278h120" fill="none" stroke="#3f5b48" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <circle cx="570" cy="278" r="54" fill="#6f91a8" stroke="#fffdf8" stroke-width="8"/>
    <path d="M545 278l17 17 34-38" fill="none" stroke="#fffdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="534" y="385" fill="#26332b" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700">测试</text>
    <text x="515" y="416" fill="#69746c" font-family="system-ui,-apple-system,sans-serif" font-size="15">证明可用</text>
  </g>
  <path d="M632 278h120" fill="none" stroke="#3f5b48" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <circle cx="790" cy="278" r="54" fill="#3f5b48" stroke="#fffdf8" stroke-width="8"/>
    <path d="M790 243v42M771 264l19-21 19 21M766 296h48" fill="none" stroke="#fffdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="752" y="385" fill="#26332b" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700">部署</text>
    <text x="735" y="416" fill="#69746c" font-family="system-ui,-apple-system,sans-serif" font-size="15">交付上线</text>
  </g>
  <path d="M852 278h120" fill="none" stroke="#3f5b48" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <circle cx="1010" cy="278" r="54" fill="#e57c6e" stroke="#fffdf8" stroke-width="8"/>
    <path d="M985 278c0-15 11-27 25-27s25 12 25 27-11 27-25 27-25-12-25-27zm25-15v15l10 7" fill="none" stroke="#26332b" stroke-width="4" stroke-linecap="round"/>
    <text x="970" y="385" fill="#26332b" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700">反馈</text>
    <text x="954" y="416" fill="#69746c" font-family="system-ui,-apple-system,sans-serif" font-size="15">持续迭代</text>
  </g>

  <g fill="#3f5b48" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="600">
    <text x="252" y="475">可回退</text><text x="540" y="475">可验证</text><text x="820" y="475">可观测</text>
  </g>
</svg>
