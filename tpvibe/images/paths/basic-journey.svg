<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">基础篇学习路径</title>
  <desc id="desc">从一个想法开始，经由 AI 协作和反复修改，完成可预览作品并正式上线。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#23352b" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l9 5-9 5" fill="none" stroke="#3f5b48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="#f7f2e8"/>
  <path d="M70 410C250 300 320 470 490 350s250-20 360 30 180-20 280-110" fill="none" stroke="#b4aa76" stroke-width="18" opacity=".35" stroke-linecap="round"/>
  <path d="M70 410C250 300 320 470 490 350s250-20 360 30 180-20 280-110" fill="none" stroke="#3f5b48" stroke-width="3" stroke-dasharray="8 12" stroke-linecap="round"/>
  <text x="72" y="72" fill="#26332b" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700">基础篇：先做出来，再逐步理解</text>
  <text x="72" y="106" fill="#69746c" font-family="system-ui,-apple-system,sans-serif" font-size="17">一条从想法到上线的第一次完整闭环</text>

  <g filter="url(#shadow)">
    <rect x="70" y="160" width="220" height="168" rx="20" fill="#fffdf8" stroke="#d9d3c4"/>
    <circle cx="125" cy="214" r="28" fill="#e57c6e" opacity=".9"/>
    <path d="M113 222c4-17 22-17 26 0M119 235h12M120 241h10M125 191v-12M104 200l-9-8M146 200l9-8" fill="none" stroke="#26332b" stroke-width="3" stroke-linecap="round"/>
    <text x="102" y="278" fill="#26332b" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700">一个想法</text>
    <text x="102" y="306" fill="#69746c" font-family="system-ui,-apple-system,sans-serif" font-size="16">描述目标</text>
  </g>
  <path d="M310 246h82" fill="none" stroke="#3f5b48" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="410" y="160" width="220" height="168" rx="20" fill="#fffdf8" stroke="#d9d3c4"/>
    <circle cx="465" cy="214" r="28" fill="#b4aa76" opacity=".95"/>
    <path d="M450 214h30M465 199v30M454 203l22 22M476 203l-22 22" fill="none" stroke="#26332b" stroke-width="3" stroke-linecap="round"/>
    <text x="442" y="278" fill="#26332b" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700">AI 协作</text>
    <text x="442" y="306" fill="#69746c" font-family="system-ui,-apple-system,sans-serif" font-size="16">生成与修改</text>
  </g>
  <path d="M650 246h82" fill="none" stroke="#3f5b48" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="750" y="160" width="220" height="168" rx="20" fill="#fffdf8" stroke="#d9d3c4"/>
    <circle cx="805" cy="214" r="28" fill="#6f91a8" opacity=".95"/>
    <rect x="790" y="199" width="30" height="28" rx="4" fill="none" stroke="#26332b" stroke-width="3"/>
    <path d="M795 237h20M800 232v-5M810 232v-5" fill="none" stroke="#26332b" stroke-width="3" stroke-linecap="round"/>
    <text x="782" y="278" fill="#26332b" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700">可预览作品</text>
    <text x="782" y="306" fill="#69746c" font-family="system-ui,-apple-system,sans-serif" font-size="16">验证与迭代</text>
  </g>
  <path d="M990 246h82" fill="none" stroke="#3f5b48" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1070" y="160" width="90" height="168" rx="20" fill="#3f5b48"/>
    <circle cx="1115" cy="214" r="28" fill="#e57c6e"/>
    <path d="M1115 197v34M1098 214h34M1104 203l22 22M1126 203l-22 22" fill="none" stroke="#fffdf8" stroke-width="3" stroke-linecap="round"/>
    <text x="1090" y="278" fill="#fffdf8" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="700">正式</text>
    <text x="1090" y="303" fill="#fffdf8" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="700">上线</text>
  </g>
</svg>
