name: site-checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run site integrity checks
        run: python3 scripts/check_site.py

      - name: Verify scripts compile
        run: |
          python3 -m py_compile scripts/crawl_tpvibe.py scripts/fill_tpvibe.py scripts/check_site.py
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml'); print('sitemap.xml well-formed')"