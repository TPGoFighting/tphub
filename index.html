/* Theme button icon sync */
(function(){
  var btn=document.querySelector('.theme-btn');
  if(!btn)return;
  function sync(){btn.textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙';}
  sync();
  btn.addEventListener('click',function(){setTimeout(sync,0);});
})();
</script>
<script>
/* Auto-collapse TOC: only expand the section containing the current page */
(function(){
  var details=document.querySelectorAll('aside.toc details.toc-sec');
  if(details.length<2)return;
  var current=location.pathname.replace(/\/$/,'');
  var activeLink=null;
  document.querySelectorAll('aside.toc a').forEach(function(a){
    var href=a.getAttribute('href')||'';
    if(href && !href.startsWith('http') && !href.startsWith('#')){
      var path=href.replace(/^https?:\/\/[^\/]+/,'').replace(/\/$/,'');
      if(current===path || current.indexOf(path)>-1 || path.indexOf(current)>-1){
        activeLink=a;
      }
    }
  });
  details.forEach(function(d){
    if(activeLink && d.contains(activeLink)){d.setAttribute('open','');}
    else{d.removeAttribute('open');}
  });
})();
</script>
